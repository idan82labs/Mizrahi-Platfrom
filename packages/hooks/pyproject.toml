[project]
name = "mizrahi-hooks"
version = "1.0.0"
description = "Validation hooks for Mizrahi Compliance Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mizrahi-shared",
    "pandas>=2.1.0",
    "openpyxl>=3.1.0",
    "httpx>=0.26.0",
    "selenium>=4.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mizrahi_hooks"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv.sources]
mizrahi-shared = { path = "../shared", editable = true }
