[project]
name = "mizrahi-shared"
version = "1.0.0"
description = "Shared utilities for Mizrahi Compliance Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0.0",
    "openpyxl>=3.1.0",
    "httpx>=0.26.0",
    "resend>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mizrahi_shared"]

[tool.ruff]
line-length = 100
target-version = "py311"
