# Development Environment Configuration

environment: "development"

server:
  host: "127.0.0.1"
  port: 8000
  workers: 1
  reload: true

database:
  url: "sqlite:///./dev.db"
  echo: true

redis:
  enabled: false

email:
  provider: "console"  # Print to console instead of sending

apify:
  timeout_seconds: 60
  mock_enabled: true  # Use cached test data when available

logging:
  level: "DEBUG"
  format: "text"

monitoring:
  enabled: false

cors:
  allowed_origins:
    - "http://localhost:5173"
    - "http://localhost:3000"
